<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrawPad Studio</title>
  <link rel="stylesheet" href="DrawingPadStyleSheet.css">
</head>


<body>
<header>
  <h1>DrawPad Studio</h1>
  
</header>
 
<div class="workspace">
  <!--  TOOLBAR -->
  <div class="toolbar">
    <span class="tb-label">Draw</span>
    <button class="tool-btn active" data-tool="pen">
      ✏️<span class="tip">Pen  [P]</span>
    </button>
    <button class="tool-btn" data-tool="eraser">
      🧹<span class="tip">Eraser  [E]</span>
    </button>
    <div class="tb-divider"></div>
    <span class="tb-label">Shape</span>
    <button class="tool-btn" data-tool="line">
      ╱<span class="tip">Line  [L]</span>
    </button>
    <button class="tool-btn" data-tool="rect">
      ▭<span class="tip">Rectangle  [R]</span>
    </button>
    <button class="tool-btn" data-tool="circle">
      ◯<span class="tip">Ellipse  [C]</span>
    </button>
    <div class="tb-divider"></div>
    <span class="tb-label">Color</span>
    <button class="tool-btn" data-tool="fill">
      🪣<span class="tip">Fill  [F]</span>
    </button>
    <button class="tool-btn" data-tool="eyedrop">
      💉<span class="tip">Eyedropper  [I]</span>
    </button>
  </div>
 
  <!-- CANVAS -->
  <div class="canvas-wrap">
    <div class="canvas-scroll" id="canvasScroll">
      <canvas id="logo-canvas" width="870" height="690"></canvas>
    </div>
 
    <!-- Thumbnail strip -->
    <div class="panel-card" style="padding:10px 12px;">
      <div class="panel-title">Saved Logos</div>
      <div class="thumb-strip" id="thumbStrip">
        <span style="font-size:0.72rem;color:var(--text-dim);align-self:center;">No saves yet</span>
      </div>
      <div class="info-row">
        <span>Current</span><span id="historyIndexDisplay">—</span>
        <span style="margin-left:14px;">Total</span><span id="count">0</span>
      </div>
    </div>
  </div>
 
  <!-- RIGHT PANEL -->
  <div class="right-panel">
 
    <!-- Colors -->
    <div class="panel-card">
      <div class="panel-title">Color</div>
      <div class="color-grid" id="swatchGrid"></div>
      <div class="custom-row">
        <input type="color" id="customColorPicker" value="#000000" title="Custom colour">
        <div id="currentColorDisplay" style="background:#000000;"></div>
      </div>
    </div>
 
    <!-- Brush -->
    <div class="panel-card">
      <div class="panel-title">Brush</div>
      <div class="slider-group">
        <div class="slider-row">
          <label>Size</label>
          <input type="range" id="brushSize" min="1" max="100" value="5">
          <span class="sv" id="brushSizeVal">5</span>
        </div>
        <div class="slider-row">
          <label>Opacity</label>
          <input type="range" id="brushOpacity" min="0.05" max="1" step="0.01" value="1">
          <span class="sv" id="brushOpacityVal">100%</span>
        </div>
      </div>
    </div>
 
    <!-- Actions -->
    <div class="panel-card">
      <div class="panel-title">Actions</div>
      <button class="btn-full btn-save" onclick="saveDrawing()">Save Logo</button>
      <div class="nav-row">
        <button onclick="prevLogo()" title="Previous [←]">⬅</button>
        <button onclick="nextLogo()" title="Next [→]">➡</button>
        <button class="btn-undo" onclick="undo()" title="Undo [Ctrl+Z]">↩</button>
      </div>
      <button class="btn-full btn-export" onclick="exportPNG()">Export PNG</button>
      <button class="btn-full btn-danger" onclick="clearCanvas()">Clear Canvas</button>
    </div>
 
    <!-- Info -->
    <div class="panel-card">
      <div class="panel-title">Info</div>
      <div class="info-row"><span>Canvas</span><span>1000×1000</span></div>
      <div class="info-row"><span>Tool</span><span id="activeTool">pen</span></div>
      <div class="info-row"><span>Pos</span><span id="cursorPos">—</span></div>
    </div>
 
  </div>
</div>
 <script src="DrawingPad.js"></script>
</body>
</html>
